name: Android Build & Release

# 触发方式：
#   - push 一个 v* 标签（如 git tag v1.6.0 && git push origin --tags）：构建 APK 并发布对应 GitHub Release
#   - 手动触发（workflow_dispatch）：只构建并上传 APK 为构建产物，不发 Release
#
# 所需仓库 Secrets（必须在 repo 设置里配置，否则 release 签名会缺失）：
#   KEYSTORE_BASE64        — android/app/k12-vocab-release.jks 的 base64（本地生成：certutil -encode 或 openssl base64）
#   KEYSTORE_STORE_PASSWORD— keystore 口令
#   KEYSTORE_ALIAS         — 密钥别名（本工程为 k12-vocab）
#   KEYSTORE_KEY_PASSWORD  — 密钥口令

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Configure release signing (from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PW: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/k12-vocab-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=k12-vocab-release.jks
          storePassword=$STORE_PW
          keyAlias=$ALIAS
          keyPassword=$KEY_PW
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify signed APK
        working-directory: android
        run: |
          if [ -f app/build/outputs/apk/release/k12-release.apk ]; then
            echo "APK size: $(du -h app/build/outputs/apk/release/k12-release.apk | cut -f1)"
          else
            echo "::error::release APK not found"; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: k12-release-apk
          path: android/app/build/outputs/apk/release/k12-release.apk

      - name: Publish to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/k12-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}